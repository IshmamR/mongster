name: Publish Package to JSR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (build + sanity check, skip publish)"
        required: false
        default: true
        type: boolean

concurrency:
  group: publish-jsr-${{github.ref}}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve tag version
        if: github.event_name == 'release'
        id: tag
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' does not match expected semver pattern"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG} → Version: ${VERSION}"

      - name: Verify tag matches jsr.json
        if: github.event_name == 'release'
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./jsr.json').version")
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::jsr.json version (${PKG_VERSION}) does not match tag version (${TAG_VERSION})"
            exit 1
          fi
          echo "✓ jsr.json version (${PKG_VERSION}) matches tag"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
        env:
          NODE_ENV: test

      - name: Publish to jsr (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npx jsr publish --dry-run

      - name: Publish to jsr
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npx jsr publish
